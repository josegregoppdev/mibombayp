<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ingrediente')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4" style="max-width: 640px;">
		<h1 class="h3 mb-3" th:text="${edicion} ? 'Editar ingrediente' : 'Nuevo ingrediente'">Nuevo ingrediente</h1>

		<div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

		<form class="card bg-body-tertiary border-secondary"
			th:object="${ingrediente}"
			th:action="${edicion} ? @{/admin/ingredientes/{id}(id=${ingrediente.id})} : @{/admin/ingredientes}"
			method="post">
			<div class="card-body">
				<div class="mb-3">
					<label class="form-label" for="nombre">Nombre</label>
					<input class="form-control" type="text" id="nombre" th:field="*{nombre}"
						th:errorclass="is-invalid" required>
					<div class="invalid-feedback" th:errors="*{nombre}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="unidadMedida">Unidad de medida</label>
					<select class="form-select" id="unidadMedida" th:field="*{unidadMedida}" th:errorclass="is-invalid">
						<option th:each="u : ${unidades}" th:value="${u}" th:text="${u}">KG</option>
					</select>
					<div class="invalid-feedback" th:errors="*{unidadMedida}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="stockActual">Stock actual</label>
					<input class="form-control" type="number" id="stockActual" th:field="*{stockActual}"
						th:errorclass="is-invalid" min="0" step="0.001" required>
					<div class="invalid-feedback" th:errors="*{stockActual}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="stockMinimo">Stock mínimo</label>
					<input class="form-control" type="number" id="stockMinimo" th:field="*{stockMinimo}"
						th:errorclass="is-invalid" min="0" step="0.001" required>
					<div class="invalid-feedback" th:errors="*{stockMinimo}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="valorCompra">Costo Compra</label>
					<input class="form-control" type="number" id="valorCompra" th:field="*{valorCompra}"
						th:errorclass="is-invalid" min="0" step="0.01" required>
					<div class="invalid-feedback" th:errors="*{valorCompra}">Error</div>
				</div>

				<div class="form-check mb-3">
					<input class="form-check-input" type="checkbox" id="esAdicional" th:field="*{esAdicional}">
					<label class="form-check-label" for="esAdicional">Es adicional (se vende como extra)</label>
				</div>

				<div class="mb-3">
					<label class="form-label" for="porcionAdicional">Porción adicional</label>
					<input class="form-control" type="number" id="porcionAdicional" th:field="*{porcionAdicional}"
						th:errorclass="is-invalid" min="0" step="0.001" required>
					<div class="invalid-feedback" th:errors="*{porcionAdicional}">Error</div>
					<div class="form-text">Cantidad que se agrega por extra, en la unidad del ingrediente. Solo tiene sentido si es adicional.</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="precioAdicional">Precio adicional</label>
					<input class="form-control" type="number" id="precioAdicional" th:field="*{precioAdicional}"
						th:errorclass="is-invalid" min="0" step="0.01" required>
					<div class="invalid-feedback" th:errors="*{precioAdicional}">Error</div>
					<div class="form-text">Lo que cobra el cliente por cada extra.</div>
				</div>

				<div class="form-check mb-3" th:if="${edicion}">
					<input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
					<label class="form-check-label" for="activo">Activo</label>
				</div>

				<div class="d-flex gap-2">
					<button class="btn btn-warning" type="submit">Guardar</button>
					<a class="btn btn-outline-secondary" th:href="@{/admin/ingredientes}">Cancelar</a>
				</div>
			</div>
		</form>
	</main>
</body>
</html>
