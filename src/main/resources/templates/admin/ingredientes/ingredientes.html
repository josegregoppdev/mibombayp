<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ingredientes')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h3 mb-0">Gestión de ingredientes</h1>
			<a class="btn btn-warning" th:href="@{/admin/ingredientes/nuevo}">Nuevo ingrediente</a>
		</div>

		<div class="alert alert-success" th:if="${exito}" th:text="${exito}">OK</div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}">No se pudo completar la operación.</div>

		<div class="card bg-body-tertiary border-secondary">
			<div class="table-responsive">
				<table class="table table-striped align-middle mb-0">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Unidad</th>
							<th>Stock actual</th>
							<th>Stock mínimo</th>
							<th>Compra</th>
							<th>Venta</th>
							<th>Porción extra</th>
							<th>Precio extra</th>
							<th>Adicional</th>
							<th>Estado</th>
							<th class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="i : ${ingredientes}">
							<td th:text="${i.nombre}">Tomate</td>
							<td>
								<span class="badge text-bg-secondary" th:text="${i.unidadMedida}">KG</span>
							</td>
							<td th:text="${i.stockActual}">0</td>
							<td th:text="${i.stockMinimo}">0</td>
							<td th:text="${i.valorCompra}">0</td>
							<td th:text="${i.valorVenta}">0</td>
							<td>
								<span th:if="${i.esAdicional}">
									<span th:text="${i.porcionAdicional}">0</span>
									<span class="badge text-bg-secondary" th:text="${i.unidadMedida}">KG</span>
								</span>
								<span th:unless="${i.esAdicional}" class="text-body-secondary">—</span>
							</td>
							<td>
								<span th:if="${i.esAdicional}" th:text="${i.precioAdicional}">0</span>
								<span th:unless="${i.esAdicional}" class="text-body-secondary">—</span>
							</td>
							<td>
								<span class="badge"
									th:classappend="${i.esAdicional} ? 'text-bg-warning' : 'text-bg-secondary'"
									th:text="${i.esAdicional} ? 'Sí' : 'No'">Sí</span>
							</td>
							<td>
								<span class="badge"
									th:classappend="${i.activo} ? 'text-bg-success' : 'text-bg-danger'"
									th:text="${i.activo} ? 'Activo' : 'Inactivo'">Activo</span>
							</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-warning"
									th:href="@{/admin/ingredientes/{id}/editar(id=${i.id})}">Editar</a>
								<form class="d-inline"
									th:action="@{/admin/ingredientes/{id}/activo(id=${i.id})}" method="post">
									<button class="btn btn-sm"
										th:classappend="${i.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
										th:text="${i.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
								</form>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(ingredientes)}">
							<td colspan="11" class="text-center text-body-secondary">No hay ingredientes registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</body>
</html>
