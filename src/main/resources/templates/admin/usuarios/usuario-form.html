<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuario')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4" style="max-width: 640px;">
		<h1 class="h3 mb-3" th:text="${edicion} ? 'Editar usuario' : 'Nuevo usuario'">Nuevo usuario</h1>

		<div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>

		<form class="card bg-body-tertiary border-secondary"
			th:object="${usuario}"
			th:action="${edicion} ? @{/admin/usuarios/{id}(id=${usuario.id})} : @{/admin/usuarios}"
			method="post">
			<div class="card-body">
				<div class="mb-3">
					<label class="form-label" for="username">Usuario</label>
					<input class="form-control" type="text" id="username" th:field="*{username}"
						th:errorclass="is-invalid" th:readonly="${edicion}" autocomplete="username" required>
					<div class="invalid-feedback" th:errors="*{username}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="nombreCompleto">Nombre completo</label>
					<input class="form-control" type="text" id="nombreCompleto" th:field="*{nombreCompleto}"
						th:errorclass="is-invalid" required>
					<div class="invalid-feedback" th:errors="*{nombreCompleto}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="rol">Rol</label>
					<select class="form-select" id="rol" th:field="*{rol}" th:errorclass="is-invalid">
						<option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ADMIN</option>
					</select>
					<div class="invalid-feedback" th:errors="*{rol}">Error</div>
				</div>

				<div class="mb-3">
					<label class="form-label" for="password">Contraseña</label>
					<input class="form-control" type="password" id="password" th:field="*{password}"
						th:errorclass="is-invalid" autocomplete="new-password" th:required="${!edicion}">
					<div class="invalid-feedback" th:errors="*{password}">Error</div>
					<div class="form-text" th:if="${edicion}">Déjala vacía para mantener la actual.</div>
				</div>

				<div class="form-check mb-3" th:if="${edicion}">
					<input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}">
					<label class="form-check-label" for="activo">Activo</label>
				</div>

				<div class="d-flex gap-2">
					<button class="btn btn-warning" type="submit">Guardar</button>
					<a class="btn btn-outline-secondary" th:href="@{/admin/usuarios}">Cancelar</a>
				</div>
			</div>
		</form>
	</main>
</body>
</html>
