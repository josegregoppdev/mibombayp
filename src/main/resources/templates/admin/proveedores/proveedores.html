<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Proveedores')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h3 mb-0">Gestión de proveedores</h1>
			<a class="btn btn-warning" th:href="@{/admin/proveedores/nuevo}">Nuevo proveedor</a>
		</div>

		<div class="alert alert-success" th:if="${exito}" th:text="${exito}">OK</div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}">No se pudo completar la operación.</div>

		<div class="card bg-body-tertiary border-secondary">
			<div class="table-responsive">
				<table class="table table-striped align-middle mb-0">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Apellido</th>
							<th>DNI/NIT</th>
							<th>Dirección</th>
							<th>Teléfono</th>
							<th>Email</th>
							<th>Estado</th>
							<th class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="p : ${proveedores}">
							<td th:text="${p.nombre}">Proveedor</td>
							<td th:text="${p.apellido}">Apellido</td>
							<td th:text="${p.dniNit}">0</td>
							<td th:text="${p.direccion}">Dirección</td>
							<td th:text="${p.telefono}">0</td>
							<td th:text="${p.email}">email</td>
							<td>
								<span class="badge"
									th:classappend="${p.activo} ? 'text-bg-success' : 'text-bg-danger'"
									th:text="${p.activo} ? 'Activo' : 'Inactivo'">Activo</span>
							</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-warning"
									th:href="@{/admin/proveedores/{id}/editar(id=${p.id})}">Editar</a>
								<form class="d-inline"
									th:action="@{/admin/proveedores/{id}/activo(id=${p.id})}" method="post">
									<button class="btn btn-sm"
										th:classappend="${p.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
										th:text="${p.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
								</form>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(proveedores)}">
							<td colspan="8" class="text-center text-body-secondary">No hay proveedores registrados.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</body>
</html>
