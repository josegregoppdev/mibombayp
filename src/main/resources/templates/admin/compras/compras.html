<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Compras')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h3 mb-0">Gestión de compras</h1>
			<a class="btn btn-warning" th:href="@{/admin/compras/nuevo}">Nueva compra</a>
		</div>

		<div class="alert alert-success" th:if="${exito}" th:text="${exito}">OK</div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}">No se pudo completar la operación.</div>

		<div class="card bg-body-tertiary border-secondary">
			<div class="table-responsive">
				<table class="table table-striped align-middle mb-0">
					<thead>
						<tr>
							<th>Fecha</th>
							<th>Proveedor</th>
							<th>Estado</th>
							<th>Total</th>
							<th class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="c : ${compras}">
							<td th:text="${c.fecha}">01/01/2026 00:00</td>
							<td th:text="${c.proveedorNombre}">Proveedor</td>
							<td>
								<span class="badge"
									th:classappend="${c.estado == 'BORRADOR'} ? 'text-bg-secondary' : 'text-bg-success'"
									th:text="${c.estado == 'BORRADOR'} ? 'Borrador' : 'Confirmada'">Borrador</span>
							</td>
							<td th:text="${c.total}">0</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-warning"
									th:href="@{/admin/compras/{id}/editar(id=${c.id})}">Editar</a>
								<form class="d-inline" th:if="${c.estado == 'BORRADOR'}"
									th:action="@{/admin/compras/{id}/confirmar(id=${c.id})}" method="post">
									<button class="btn btn-sm btn-success">Confirmar</button>
								</form>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(compras)}">
							<td colspan="5" class="text-center text-body-secondary">No hay compras registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</body>
</html>
