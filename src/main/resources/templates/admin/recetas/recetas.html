<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recetas')}"></head>
<body class="bg-body-secondary">
	<header th:replace="~{fragments/header :: cabecera}"></header>

	<main class="container py-4">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h1 class="h3 mb-0">Gestión de recetas</h1>
			<a class="btn btn-warning" th:href="@{/admin/recetas/nuevo}">Nueva receta</a>
		</div>

		<div class="alert alert-success" th:if="${exito}" th:text="${exito}">OK</div>
		<div class="alert alert-danger" th:if="${error}" th:text="${error}">No se pudo completar la operación.</div>

		<div class="card bg-body-tertiary border-secondary">
			<div class="table-responsive">
				<table class="table table-striped align-middle mb-0">
					<thead>
						<tr>
							<th>Nombre</th>
							<th>Costo</th>
							<th>Estado</th>
							<th class="text-end">Acciones</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="r : ${recetas}">
							<td th:text="${r.nombre}">Salsa</td>
							<td th:text="${r.costo}">0</td>
							<td>
								<span class="badge"
									th:classappend="${r.activo} ? 'text-bg-success' : 'text-bg-danger'"
									th:text="${r.activo} ? 'Activo' : 'Inactivo'">Activo</span>
							</td>
							<td class="text-end">
								<a class="btn btn-sm btn-outline-success"
									th:href="@{/admin/recetas/{id}/editar(id=${r.id})}">Ver / Editar</a>
								<form class="d-inline"
									th:action="@{/admin/recetas/{id}/activo(id=${r.id})}" method="post">
									<button class="btn btn-sm"
										th:classappend="${r.activo} ? 'btn-outline-danger' : 'btn-outline-success'"
										th:text="${r.activo} ? 'Desactivar' : 'Activar'">Desactivar</button>
								</form>
							</td>
						</tr>
						<tr th:if="${#lists.isEmpty(recetas)}">
							<td colspan="4" class="text-center text-body-secondary">No hay recetas registradas.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>
</body>
</html>
