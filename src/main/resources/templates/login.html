<!DOCTYPE html>
<html lang="es" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>
<body class="d-flex min-vh-100 align-items-center justify-content-center bg-body-secondary">
	<main class="card bg-body-tertiary border-secondary w-100" style="max-width: 400px;">
		<div class="card-body p-4">
			<h1 class="h4 text-center mb-1">Sistema de Barra</h1>
			<p class="text-body-secondary text-center mb-4">Inicia sesión para continuar</p>

			<div class="alert alert-danger py-2" th:if="${param.error}">Usuario o contraseña incorrectos.</div>
			<div class="alert alert-success py-2" th:if="${param.logout}">Sesión cerrada correctamente.</div>

			<form th:action="@{/login}" method="post">
				<div class="mb-3">
					<label class="form-label" for="username">Usuario</label>
					<input class="form-control" type="text" id="username" name="username"
						autocomplete="username" autofocus required>
				</div>
				<div class="mb-3">
					<label class="form-label" for="password">Contraseña</label>
					<input class="form-control" type="password" id="password" name="password"
						autocomplete="current-password" required>
				</div>
				<button class="btn btn-warning w-100 fw-semibold" type="submit">Entrar</button>
			</form>
		</div>
	</main>
</body>
</html>
